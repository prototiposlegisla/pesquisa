name: Update Database

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      layers:
        description: 'Layers to update (comma-separated, e.g. "atual,recente" or "all")'
        required: true
        default: 'auto'
        type: string

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Determine layers to update
        id: layers
        run: |
          DATE_MD=$(date +%m-%d)
          WEEKDAY=$(date +%u) # 1-7, 7 is Sunday
          INPUT_LAYERS="${{ github.event.inputs.layers }}"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "$INPUT_LAYERS" != "auto" ] && [ -n "$INPUT_LAYERS" ]; then
            echo "layers=$INPUT_LAYERS" >> $GITHUB_OUTPUT
            echo "Running MANUAL update ($INPUT_LAYERS)"
          elif [ "$DATE_MD" == "01-01" ]; then
            echo "layers=all" >> $GITHUB_OUTPUT
            echo "Running YEARLY update (all)"
          elif [ "$DATE_MD" == "07-01" ]; then
            echo "layers=medio,atual" >> $GITHUB_OUTPUT
            echo "Running SEMESTRAL update (medio, atual)"
          elif [ "$WEEKDAY" == "7" ]; then
            echo "layers=recente,atual" >> $GITHUB_OUTPUT
            echo "Running WEEKLY update (recente, atual)"
          else
            echo "layers=atual" >> $GITHUB_OUTPUT
            echo "Running DAILY update (atual)"
          fi

      - name: Run update script
        run: python scripts/atualizar.py --layer ${{ steps.layers.outputs.layers }}

      - name: Prepare deployment
        run: |
          mkdir public
          
          # Copy generated data (includes dados/version.json)
          if [ -d "dados" ]; then
            cp -r dados public/
          else
            echo "No dados directory found"
          fi
          
          # Copy version.json to root of public usually
          if [ -f "dados/version.json" ]; then cp dados/version.json public/; fi
          
          # Copy frontend assets matches root structure
          cp index.html public/
          if [ -d "assets" ]; then cp -r assets public/; fi
          if [ -f "CNAME" ]; then cp CNAME public/; fi
          if [ -f "LICENSE" ]; then cp LICENSE public/; fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
