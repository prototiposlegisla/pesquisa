name: Update Database

on:
  # Disparo principal: o cron-job.org chama a API (workflow_dispatch) todo dia às
  # 02h23 de São Paulo. Ver specs/spec-database.md, seção 7.
  schedule:
    # Reserva: 05:23 UTC (02h23 em SP), mas o GitHub atrasa o disparo de 4 a 10 horas.
    # Só coleta se o disparo externo não tiver rodado (job "gate").
    - cron: '23 5 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      layers:
        description: 'Layers to update (comma-separated or "all")'
        required: true
        default: 'all'
        type: string

permissions:
  contents: write
  actions: read  # o job "gate" consulta as execuções recentes

jobs:
  # O disparo agendado do GitHub chega horas depois do externo. Se o externo já
  # rodou (ou está rodando), o agendado desiste, para não coletar duas vezes no dia.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip scheduled run if an external dispatch already ran
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # Disparos das últimas 20 h, bem-sucedidos ou ainda em andamento.
            # Se a consulta falhar, a coleta roda (melhor duas vezes que nenhuma).
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update.yml --event workflow_dispatch --limit 30 --json status,conclusion,createdAt --jq '[.[] | select((.createdAt | fromdateiso8601) > (now - 72000)) | select(.conclusion == "success" or .status != "completed")] | length') || n=0
            if [ "${n:-0}" -gt 0 ]; then
              echo "::notice::Coleta já feita por disparo externo nas últimas 20 h; execução agendada dispensada."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A coleta completa leva de 45 a 80 min; acima disso travou.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore existing data from gh-pages
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1 || echo "No gh-pages branch found"
          git checkout origin/gh-pages -- dados/ || echo "No existing data found"

      - name: Determine layers to update
        id: layers
        run: |
          INPUT_LAYERS="${{ github.event.inputs.layers }}"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "$INPUT_LAYERS" ]; then
            echo "layers=$INPUT_LAYERS" >> $GITHUB_OUTPUT
            echo "Running MANUAL update ($INPUT_LAYERS)"
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "layers=none" >> $GITHUB_OUTPUT
            echo "Running CODE-ONLY update (none)"
          else
            echo "layers=all" >> $GITHUB_OUTPUT
            echo "Running DAILY update (all — hash protege contra gravações desnecessárias)"
          fi

      - name: Install dependencies
        if: steps.layers.outputs.layers != 'none'
        run: |
          pip install requests

      # Layer que falha mantém o arquivo restaurado do gh-pages; as demais seguem
      # para o deploy. O job ainda termina vermelho no passo final.
      - name: Run update script
        id: update
        if: steps.layers.outputs.layers != 'none'
        continue-on-error: true
        env:
          # Cada linha sai com o próprio timestamp, o que permite medir o tempo de cada página.
          PYTHONUNBUFFERED: 1
        run: python scripts/atualizar.py --layer ${{ steps.layers.outputs.layers }}

      - name: Prepare deployment
        run: |
          mkdir public

          # Copy generated data (includes dados/version.json)
          if [ -d "dados" ]; then
            cp -r dados public/
          else
            echo "No dados directory found"
          fi

          # Copy frontend assets matches root structure
          cp index.html public/
          if [ -d "assets" ]; then cp -r assets public/; fi
          if [ -f "CNAME" ]; then cp CNAME public/; fi
          if [ -f "LICENSE" ]; then cp LICENSE public/; fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      - name: Fail if update had errors
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Atualização parcial: uma ou mais layers falharam (ver passo 'Run update script'). O deploy publicou as demais."
          exit 1
