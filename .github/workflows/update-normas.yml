name: Update Normas

on:
  # Disparo principal: o cron-job.org chama a API (workflow_dispatch) todo dia às
  # 11h00 de São Paulo. Ver specs/spec-database.md, seção 7.
  schedule:
    # Reserva: 14:00 UTC (11h00 em SP), mas o GitHub atrasa o disparo de 4 a 9 horas.
    # Só coleta se o disparo externo não tiver rodado (job "gate").
    - cron: '00 14 * * *'
  workflow_dispatch:
    inputs:
      layers:
        description: 'Layers to update (comma-separated, e.g. "atual,2020" or "all")'
        required: true
        default: 'auto'
        type: string

permissions:
  contents: write
  actions: read  # o job "gate" consulta as execuções recentes

jobs:
  # O disparo agendado do GitHub chega horas depois do externo. Se o externo já
  # rodou (ou está rodando), o agendado desiste, para não coletar duas vezes no dia.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip scheduled run if an external dispatch already ran
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # Disparos das últimas 20 h, bem-sucedidos ou ainda em andamento.
            # Se a consulta falhar, a coleta roda (melhor duas vezes que nenhuma).
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-normas.yml --event workflow_dispatch --limit 30 --json status,conclusion,createdAt --jq '[.[] | select((.createdAt | fromdateiso8601) > (now - 72000)) | select(.conclusion == "success" or .status != "completed")] | length') || n=0
            if [ "${n:-0}" -gt 0 ]; then
              echo "::notice::Coleta já feita por disparo externo nas últimas 20 h; execução agendada dispensada."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A coleta de normas leva de 1 a 6 min; acima disso travou.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore existing data from gh-pages
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1 || echo "No gh-pages branch found"
          git checkout origin/gh-pages -- dados/ || echo "No existing data found"

      - name: Determine layers to update
        id: layers
        run: |
          INPUT_LAYERS="${{ github.event.inputs.layers }}"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "$INPUT_LAYERS" != "auto" ] && [ -n "$INPUT_LAYERS" ]; then
            echo "layers=$INPUT_LAYERS" >> $GITHUB_OUTPUT
            echo "Running MANUAL update ($INPUT_LAYERS)"
          else
            echo "layers=all" >> $GITHUB_OUTPUT
            echo "Running DAILY update (all — hash check skips unchanged layers)"
          fi

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run normas update script
        run: python scripts/atualizar_normas.py --layer ${{ steps.layers.outputs.layers }}

      - name: Prepare deployment
        run: |
          mkdir public

          # Copy generated data (includes dados/version.json)
          if [ -d "dados" ]; then
            cp -r dados public/
          else
            echo "No dados directory found"
          fi

          # Copy frontend assets matching root structure
          cp index.html public/
          if [ -d "assets" ]; then cp -r assets public/; fi
          if [ -f "CNAME" ]; then cp CNAME public/; fi
          if [ -f "LICENSE" ]; then cp LICENSE public/; fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
