name: Virada de Ano - Reconstrução Total
on:
  schedule:
    - cron: '0 8 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script (Complete Logic)
        run: python scripts/atualizar.py --layer all

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dados/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: year turnover reconstruction" && git push)
