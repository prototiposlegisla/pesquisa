name: Atualização Manual
on:
  workflow_dispatch:
    inputs:
      atual:
        description: 'Atualizar atual?'
        type: boolean
        default: false
      recente:
        description: 'Atualizar recente?'
        type: boolean
        default: false
      medio:
        description: 'Atualizar medio?'
        type: boolean
        default: false
      historico-a:
        description: 'Atualizar historico-a?'
        type: boolean
        default: false
      historico-b:
        description: 'Atualizar historico-b?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Atual
        if: ${{ inputs.atual == true }}
        run: python scripts/atualizar.py --layer atual

      - name: Update Recente
        if: ${{ inputs.recente == true }}
        run: |
          python scripts/atualizar.py --layer recente
          sleep 15

      - name: Update Medio
        if: ${{ inputs.medio == true }}
        run: |
          python scripts/atualizar.py --layer medio
          sleep 15

      - name: Update Historico A
        if: ${{ inputs.historico-a == true }}
        run: |
          python scripts/atualizar.py --layer historico-a
          sleep 15

      - name: Update Historico B
        if: ${{ inputs.historico-b == true }}
        run: python scripts/atualizar.py --layer historico-b

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dados/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Manual update: database layers" && git push)
